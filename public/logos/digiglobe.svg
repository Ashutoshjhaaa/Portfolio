<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dg-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="22" fill="url(#dg-bg)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#dg-primary)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Globe Outer Sphere Outline -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#dg-primary)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Globe Latitudes / Longitudes Curves -->
  <!-- Horizontal Equator -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="url(#dg-glow)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <!-- Top Latitude -->
  <ellipse cx="50" cy="38" rx="26" ry="7" fill="none" stroke="url(#dg-glow)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Bottom Latitude -->
  <ellipse cx="50" cy="62" rx="26" ry="7" fill="none" stroke="url(#dg-glow)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
  
  <!-- Vertical Center Longitude -->
  <ellipse cx="50" cy="50" rx="14" ry="30" fill="none" stroke="url(#dg-primary)" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="50" cy="50" rx="24" ry="30" fill="none" stroke="url(#dg-primary)" stroke-width="1.2" opacity="0.5"/>

  <!-- Core Connected Nodes & Pulse -->
  <circle cx="50" cy="50" r="4.5" fill="url(#dg-glow)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="2" fill="#ffffff"/>
  
  <!-- Orbiting Tech Satellites / Network Nodes -->
  <circle cx="36" cy="38" r="2.5" fill="#38bdf8"/>
  <circle cx="64" cy="62" r="2.5" fill="#a855f7"/>
  <circle cx="50" cy="20" r="2" fill="#00f2fe"/>
  <circle cx="50" cy="80" r="2" fill="#6366f1"/>
</svg>
